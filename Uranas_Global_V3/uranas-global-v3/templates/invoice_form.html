{% extends 'base.html' %}{% block content %}<section class="formbox"><h1>Add Debt / Invoice</h1><p>Client: <b>{{client.name}}</b></p><form method="post"><label>Description<input name="description" required placeholder="e.g. Monthly sanitary bin service"></label><label>Total (KSh)<input name="total" type="number" min="0" step=".01" required></label><label>Due date<input name="due_date" type="date"></label><button class="primary">Save Debt</button></form></section>{% endblock %}

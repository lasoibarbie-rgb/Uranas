{% extends 'base.html' %}{% block content %}<section class="formbox"><h1>{{'Edit' if client else 'Add'}} Client</h1>
<p>Client information is visible only after admin login.</p><form method="post">
<label>Name<input name="name" required value="{{client.name if client else ''}}"></label>
<label>Phone<input name="phone" value="{{client.phone if client else ''}}"></label>
<label>Email<input name="email" type="email" value="{{client.email if client else ''}}"></label>
<label>Location<input name="location" value="{{client.location if client else ''}}"></label>
<label>Service<input name="service" value="{{client.service if client else ''}}"></label>
<label>Notes<textarea name="notes">{{client.notes if client else ''}}</textarea></label>
<button class="primary">Save Client</button></form></section>{% endblock %}

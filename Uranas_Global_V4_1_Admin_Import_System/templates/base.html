<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or "Uranas Global" }}</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5fbfc;color:#15343a}nav{background:#063f48;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}nav a{color:#fff;text-decoration:none;margin-left:18px}.brand{font-size:21px;font-weight:800}.container{max-width:1180px;margin:30px auto;padding:0 20px}.hero{padding:50px 0}.hero h1{font-size:44px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 5px 20px #0001}.gallery img{width:100%;height:220px;object-fit:cover;border-radius:10px}.muted{color:#63777b}.btn{border:0;background:#087f8c;color:#fff;padding:10px 16px;border-radius:8px;cursor:pointer}.danger{background:#b42318}.success{background:#eaf7f3}.alert{padding:12px;border-radius:8px;margin:10px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.section{margin:45px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd9dc;border-radius:8px;margin:6px 0 12px}textarea{min-height:80px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #e8eeee;text-align:left}@media(max-width:700px){.two{grid-template-columns:1fr}.hero h1{font-size:34px}table{font-size:13px}}</style></head>
<body><nav><a class="brand" href="{{url_for('index')}}">URANAS GLOBAL</a><div><a href="{{url_for('index')}}">Website</a>{% if logged_in %}<a href="{{url_for('admin')}}">Admin</a><a href="{{url_for('logout')}}">Logout</a>{% else %}<a href="{{url_for('login')}}">Admin Login</a>{% endif %}</div></nav>
<div class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="alert {{category}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
